[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-faceid-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "aiomysql>=0.2.0",
    "PyMySQL>=1.1.0",
    "pydantic[email]>=2.7.0,<3",
    "pydantic-settings>=2.3.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",  # passlib 1.7.4 is incompatible with bcrypt 5.x
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "APScheduler>=3.10.4",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
# M9a: engine FaceID thật (FACE_ENGINE=opencv). Không bắt buộc khi dùng mock.
face = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24",
    "cryptography>=42.0.0"
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "EXE002", "E712", "UP042", "B904"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
