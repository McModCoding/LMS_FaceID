name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: lms_db
          MYSQL_USER: lms_user
          MYSQL_PASSWORD: changeme
        options: --health-cmd="mysqladmin ping -h localhost -u lms_user -pchangeme" --health-interval=10s --health-timeout=5s --health-retries=5
        ports: ["3306:3306"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev,face]"
      - name: Prepare isolated test databases
        run: |
          mysql -h 127.0.0.1 -uroot -prootpassword -e "CREATE DATABASE IF NOT EXISTS lms_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE IF NOT EXISTS lms_seed_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON lms_test.* TO 'lms_user'@'%'; GRANT ALL PRIVILEGES ON lms_seed_test.* TO 'lms_user'@'%'; FLUSH PRIVILEGES;"
      - run: ruff check app/ tests/
      - run: alembic upgrade head
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: lms_user
          DB_PASSWORD: changeme
          DB_NAME: lms_db
          SECRET_KEY: ci-test-secret-key-not-for-production
      - name: Verify seed from an empty database
        run: |
          alembic upgrade head
          python ../scripts/seed.py
          python ../scripts/seed.py
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: lms_user
          DB_PASSWORD: changeme
          DB_NAME: lms_seed_test
          SECRET_KEY: ci-test-secret-key-not-for-production
      - run: pytest tests/ -v
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: lms_user
          DB_PASSWORD: changeme
          DB_NAME: lms_db
          SECRET_KEY: ci-test-secret-key-not-for-production
          TEST_DB_NAME: lms_test
          TEST_DB_ADMIN_USER: root
          TEST_DB_ADMIN_PASSWORD: rootpassword

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check
      - run: npm run lint
